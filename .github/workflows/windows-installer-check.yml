name: Windows Installer Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'Windows installer was not produced.'
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-windows-installer-check
          path: release/*.exe
          if-no-files-found: error
