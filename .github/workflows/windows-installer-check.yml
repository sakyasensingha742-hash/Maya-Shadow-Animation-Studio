name: Windows Installer Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            Write-Error 'Windows installer was not produced.'
          }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) {
              Write-Error "Installer is unexpectedly small: $($installer.Name)"
            }
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-windows-installer-check
          path: release/*.exe
          if-no-files-found: error
