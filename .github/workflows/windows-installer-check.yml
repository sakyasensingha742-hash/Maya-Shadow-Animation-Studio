name: Windows Installer Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        run: |
          $lastExitCode = 1
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "Windows installer build attempt $attempt of 2"
            npm run dist:win
            $lastExitCode = $LASTEXITCODE
            if ($lastExitCode -eq 0) {
              break
            }
            if ($attempt -lt 2) {
              Write-Warning "Installer build failed on attempt $attempt; retrying after 10 seconds."
              Start-Sleep -Seconds 10
            }
          }
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            Write-Error 'Windows installer was not produced.'
          }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) {
              Write-Error "Installer is unexpectedly small: $($installer.Name)"
            }
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          }

      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'maya-shadow-smoke'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Write-Host "Installing $($installer.Name) to $installDir"
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            Write-Error "Installer exited with code $($installerProcess.ExitCode)"
          }
          $appExe = Get-ChildItem -Path $installDir -Filter *.exe -File -Recurse |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $appExe) {
            Write-Error 'Installed application executable was not found.'
          }
          $resourcesDir = Join-Path $appExe.Directory.FullName 'resources'
          $ffmpegBinary = Join-Path $resourcesDir 'ffmpeg\ffmpeg.exe'
          if (-not (Test-Path $ffmpegBinary -PathType Leaf)) {
            Write-Error "Packaged FFmpeg binary was not found: $ffmpegBinary"
          }
          if ((Get-Item $ffmpegBinary).Length -lt 1MB) {
            Write-Error "Packaged FFmpeg binary is unexpectedly small: $ffmpegBinary"
          }
          Write-Host "Packaged FFmpeg: $ffmpegBinary"
          Write-Host "Launching $($appExe.FullName)"
          $appProcess = Start-Process -FilePath $appExe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($appProcess.HasExited) {
            Write-Error "Application exited during smoke test with code $($appProcess.ExitCode)."
          }
          Write-Host 'Application remained running for the smoke-test window.'
          Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-windows-installer-check
          path: release/*.exe
          if-no-files-found: error
