name: Build Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            Write-Error 'Windows installer was not produced.'
          }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) {
              Write-Error "Installer is unexpectedly small: $($installer.Name)"
            }
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-windows-installer
          path: release/*.exe
          if-no-files-found: error
