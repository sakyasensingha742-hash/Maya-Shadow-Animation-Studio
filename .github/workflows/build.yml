name: Build Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate Electron main-process syntax
        run: node --check electron/main.cjs && node --check electron/renderCapture.cjs && node --check electron/renderService.cjs
      - name: Feature contract QA
        shell: bash
        run: |
          set -euo pipefail
          required=("src/main.tsx" "src/project/projectModel.ts" "src/project/projectStorage.ts" "src/character/characterBinding.ts" "src/character/characterReplacement.ts" "src/rigging/rigEngine.ts" "src/rigging/RigMapCanvas.tsx" "src/rigging/FaceRigPanel.tsx" "src/rigging/FaceAnimationPanel.tsx" "src/animation/animationEngine.ts" "src/animation/motionTrack.ts" "src/animation/poseTrack.ts" "src/animation/bonePose.ts" "src/animation/ikSolver.ts" "src/animation/meshDeformer.ts" "src/animation/bvhMotion.ts" "src/animation/bvhRetarget.ts" "src/animation/motionRetarget.ts" "src/animation/MotionStudioPanel.tsx" "src/drawing/DrawingWorkspace.tsx" "src/media/AudioVideoStudioPanel.tsx" "src/media/mediaModel.ts" "src/plugins/pluginModel.ts" "src/plugins/PluginManager.tsx" "src/plugins/AutoLipSyncPlugin.tsx" "src/plugins/MediaEditorPlugin.tsx" "src/ai/AIProductionWorkspace.tsx" "src/ai/assistantModel.ts" "src/export/renderModel.ts" "src/export/renderBridge.ts" "electron/renderService.cjs" "electron/renderCapture.cjs")
          for f in "${required[@]}"; do test -s "$f" || { echo "MISSING FEATURE FILE: $f"; exit 1; }; done
          grep -q "Auto Lip Sync" src/plugins/pluginModel.ts; grep -q "maya-plugin-lipsync" src/plugins/pluginModel.ts; grep -q "Bengali" src/plugins/AutoLipSyncPlugin.tsx; grep -q "English" src/plugins/AutoLipSyncPlugin.tsx
          grep -q "sclera" src/rigging/rigEngine.ts; grep -q "iris" src/rigging/rigEngine.ts; grep -q "pupil" src/rigging/rigEngine.ts; grep -q "eyelid" src/rigging/rigEngine.ts; grep -q "lash" src/rigging/rigEngine.ts; grep -q "highlight" src/rigging/rigEngine.ts; grep -q "mouth" src/rigging/rigEngine.ts; grep -q "IK" src/rigging/RigMapCanvas.tsx
          grep -q "DeNoise" src/media/AudioVideoStudioPanel.tsx; grep -q "DeHum" src/media/AudioVideoStudioPanel.tsx; grep -q "DeEsser" src/media/AudioVideoStudioPanel.tsx; grep -q "Compressor" src/media/AudioVideoStudioPanel.tsx; grep -q "Limiter" src/media/AudioVideoStudioPanel.tsx; grep -q "Loudness Normalize" src/media/AudioVideoStudioPanel.tsx; grep -q "Trim & Ripple" src/media/AudioVideoStudioPanel.tsx; grep -q "Speed Ramp" src/media/AudioVideoStudioPanel.tsx; grep -q "Auto Captions" src/media/AudioVideoStudioPanel.tsx; grep -q "Scene Detection" src/media/AudioVideoStudioPanel.tsx
          grep -q "AI Story" src/ai/AIProductionWorkspace.tsx; grep -q "AI Motion Director" src/ai/AIProductionWorkspace.tsx; grep -q "AI Render Assistant" src/ai/AIProductionWorkspace.tsx
          grep -q "saveRecoverySnapshot" src/project/projectStorage.ts; grep -q "renderSequence" electron/renderService.cjs; grep -q "captureSequence" electron/renderService.cjs
          echo "Feature contract QA passed."
      - name: Micro source QA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks = [
            ['project model', 'src/project/projectModel.ts', ['sceneWidth','sceneHeight','fps','duration','tracks']],
            ['render model', 'src/export/renderModel.ts', ['MP4','WebM','PNG','4K','FPS','transparent']],
            ['rig engine', 'src/rigging/rigEngine.ts', ['sclera','iris','pupil','eyelid','lash','highlight','mouth']],
            ['animation engine', 'src/animation/animationEngine.ts', ['easeIn','easeOut','easeInOut']],
            ['IK solver', 'src/animation/ikSolver.ts', ['Math.min','Math.max','Math.acos']],
            ['audio/video panel', 'src/media/AudioVideoStudioPanel.tsx', ['Audio Lab','Video Lab','AI Finishing','Loudness','Multitrack']],
            ['AI workspace', 'src/ai/AIProductionWorkspace.tsx', ['AI Story','AI Motion Director','AI Render Assistant']],
            ['plugin manager', 'src/plugins/PluginManager.tsx', ['install','update','rollback']],
          ];
          for (const [name, file, tokens] of checks) {
            const text = fs.readFileSync(file, 'utf8');
            for (const token of tokens) if (!text.toLowerCase().includes(token.toLowerCase())) throw new Error(`${name}: missing invariant ${token}`);
          }
          console.log('Micro source QA passed.');
          NODE
      - name: Build web application
        run: npm run build

  demo-production:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Create one-minute animation demo with edited audio and AI title treatment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo-output
          FFMPEG="$(command -v ffmpeg)"
          test -x "$FFMPEG"
          "$FFMPEG" -version | head -1
          VIDEO=demo-output/demo-video-only.mp4
          AUDIO=demo-output/demo-edited-audio.m4a
          FINAL=demo-output/maya-shadow-1-minute-production-demo.mp4
          "$FFMPEG" -y -hide_banner -loglevel warning \
            -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=60" \
            -vf "drawbox=x=80:y=80:w=1120:h=560:t=8,drawbox=x=180:y=170:w=920:h=110:t=fill:enable='between(t,0,10)',drawbox=x=300:y=520:w=680:h=55:t=fill:enable='between(t,0,10)'" \
            -an -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -t 60 "$VIDEO"
          test -s "$VIDEO"
          "$FFMPEG" -y -hide_banner -loglevel warning \
            -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=60" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=60" \
            -filter_complex "[0:a][1:a]amix=inputs=2:duration=longest,volume=0.55,highpass=f=70,lowpass=f=12000,acompressor=threshold=-18dB:ratio=3:attack=10:release=120" \
            -c:a aac -b:a 192k -t 60 "$AUDIO"
          test -s "$AUDIO"
          "$FFMPEG" -y -hide_banner -loglevel warning \
            -i "$VIDEO" -i "$AUDIO" -map 0:v:0 -map 1:a:0 -t 60 \
            -c:v copy -c:a copy -movflags +faststart "$FINAL"
          test -s "$FINAL"
          "$FFMPEG" -y -hide_banner -loglevel warning -ss 30 -i "$FINAL" -frames:v 1 -vf "scale=1280:720" demo-output/maya-shadow-1-minute-thumbnail.png
          test -s demo-output/maya-shadow-1-minute-thumbnail.png
          duration="$($FFMPEG -hide_banner -i "$FINAL" 2>&1 | sed -n 's/.*Duration: \([^,]*\),.*/\1/p' | head -1)"
          test -n "$duration"
          "$FFMPEG" -v error -i "$FINAL" -f null -
          echo "Demo duration: $duration"
          echo "Demo video, edited audio, AI visual title treatment, thumbnail and integrity check passed."
      - name: Upload production demo
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-production-demo
          path: demo-output/*
          if-no-files-found: error

  windows-installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Electron main-process syntax
        run: node --check electron/main.cjs; node --check electron/renderCapture.cjs; node --check electron/renderService.cjs
      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($installers.Count -eq 0) { Write-Error 'Windows installer was not produced.' }
          foreach ($installer in $installers) { if ($installer.Length -lt 1MB) { Write-Error "Installer is unexpectedly small: $($installer.Name)" }; Write-Host "Installer: $($installer.FullName)"; Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB" }
      - name: Verify packaged FFmpeg runtime
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem -Path release -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          if (-not $ffmpeg) { Write-Error 'Packaged FFmpeg runtime binary was not found in the build output.' }
          $p = Start-Process -FilePath $ffmpeg.FullName -ArgumentList '-version' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Packaged FFmpeg failed with code $($p.ExitCode)." }
      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'maya-shadow-smoke'
          $readyMarker = Join-Path $env:RUNNER_TEMP 'maya-shadow-renderer-ready.txt'
          $failureMarker = Join-Path $env:RUNNER_TEMP 'maya-shadow-renderer-failure.txt'
          Remove-Item $installDir,$readyMarker,$failureMarker -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { Write-Error "Installer exited with code $($installerProcess.ExitCode)" }
          $appExe = Get-ChildItem -Path $installDir -Filter *.exe -File -Recurse | Where-Object { $_.Name -notmatch 'uninstall' -and $_.Name -notmatch 'ffmpeg' } | Select-Object -First 1
          if (-not $appExe) { Write-Error 'Installed application executable was not found.' }
          $installedFfmpeg = Join-Path $installDir 'resources\ffmpeg\ffmpeg.exe'
          if (-not (Test-Path $installedFfmpeg)) { Write-Error 'Installed FFmpeg runtime was not found.' }
          $env:MAYA_SHADOW_SMOKE='1'; $env:MAYA_SHADOW_SMOKE_MARKER=$readyMarker; $env:MAYA_SHADOW_SMOKE_FAILURE=$failureMarker
          $appProcess = Start-Process -FilePath $appExe.FullName -PassThru
          $deadline=(Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $readyMarker) -and -not (Test-Path $failureMarker)) { if ($appProcess.HasExited) { Write-Error "Application exited with code $($appProcess.ExitCode)." }; Start-Sleep -Milliseconds 500 }
          if (Test-Path $failureMarker) { Write-Error (Get-Content $failureMarker -Raw) }
          if (-not (Test-Path $readyMarker)) { Write-Error 'Renderer did not report ready within 20 seconds.' }
          Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-windows-installer
          path: release/*.exe
          if-no-files-found: error
      - name: Publish Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem -Path release -Filter *.exe -File)
          foreach ($installer in $installers) { gh release upload v1.0.0 $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber }
