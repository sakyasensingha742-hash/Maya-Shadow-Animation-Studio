name: Release Windows Studio

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (must match package.json version, e.g. v0.2.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Invalid release tag '$env:RELEASE_TAG'. Expected vMAJOR.MINOR.PATCH."
          }

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($tagVersion -ne $package.version) {
            Write-Error "Release tag $env:RELEASE_TAG does not match package.json version $($package.version). Refusing to publish a mismatched installer."
          }
          Write-Host "Release tag and package version match: $tagVersion"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { Write-Error 'Windows installer was not produced.' }
          if ($installer.Length -lt 1MB) { Write-Error "Installer is unexpectedly small: $($installer.Name)" }
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Verify packaged FFmpeg runtime
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem -Path release -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          if (-not $ffmpeg) { Write-Error 'Packaged FFmpeg runtime binary was not found.' }
          $p = Start-Process -FilePath $ffmpeg.FullName -ArgumentList '-version' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Packaged FFmpeg failed with code $($p.ExitCode)." }

      - name: Verify updater metadata
        shell: pwsh
        run: |
          $metadata = Join-Path (Get-Location) 'release/latest.yml'
          if (-not (Test-Path $metadata -PathType Leaf)) {
            Write-Error 'electron-builder did not produce release/latest.yml; refusing to publish an incomplete updater release.'
          }
          $metadataText = Get-Content $metadata -Raw
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($metadataText -notmatch ("(?m)^version:\s*" + [regex]::Escape($package.version) + "\s*$")) {
            Write-Error "latest.yml version does not match package.json version $($package.version)."
          }
          $blockmaps = @(Get-ChildItem -Path release -Filter *.blockmap -File)
          if ($blockmaps.Count -eq 0) {
            Write-Error 'electron-builder did not produce a .blockmap file; refusing to publish incomplete updater assets.'
          }
          Write-Host "Updater metadata verified for version $($package.version)."
          Write-Host "Blockmap files: $($blockmaps.Count)"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true
