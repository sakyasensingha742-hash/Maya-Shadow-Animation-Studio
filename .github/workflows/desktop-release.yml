name: Desktop Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            Write-Error 'Windows installer was not produced.'
          }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) {
              Write-Error "Installer is unexpectedly small: $($installer.Name)"
            }
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
