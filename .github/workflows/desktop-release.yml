name: Desktop Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $tagVersion = $env:RELEASE_REF -replace '^refs/tags/v', ''
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($tagVersion -ne $package.version) {
            Write-Error "Release tag v$tagVersion does not match package.json version $($package.version). Refusing to publish a mismatched installer."
          }
          Write-Host "Release tag and package version match: $tagVersion"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            Write-Error 'Windows installer was not produced.'
          }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) {
              Write-Error "Installer is unexpectedly small: $($installer.Name)"
            }
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          }

      - name: Verify updater metadata
        shell: pwsh
        run: |
          $metadata = Join-Path (Get-Location) 'release/latest.yml'
          if (-not (Test-Path $metadata -PathType Leaf)) {
            Write-Error 'electron-builder did not produce release/latest.yml; refusing to publish an incomplete updater release.'
          }
          $metadataText = Get-Content $metadata -Raw
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($metadataText -notmatch ("(?m)^version:\s*" + [regex]::Escape($package.version) + "\s*$")) {
            Write-Error "latest.yml version does not match package.json version $($package.version)."
          }
          $blockmaps = @(Get-ChildItem -Path release -Filter *.blockmap -File)
          if ($blockmaps.Count -eq 0) {
            Write-Error 'electron-builder did not produce a .blockmap file; refusing to publish incomplete updater assets.'
          }
          Write-Host "Updater metadata verified for version $($package.version)."
          Write-Host "Blockmap files: $($blockmaps.Count)"

      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'maya-shadow-release-smoke'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Write-Host "Installing $($installer.Name) to $installDir"
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            Write-Error "Installer exited with code $($installerProcess.ExitCode)"
          }
          $appExe = Get-ChildItem -Path $installDir -Filter *.exe -File -Recurse |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $appExe) {
            Write-Error 'Installed application executable was not found.'
          }
          Write-Host "Launching $($appExe.FullName)"
          $appProcess = Start-Process -FilePath $appExe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($appProcess.HasExited) {
            Write-Error "Application exited during smoke test with code $($appProcess.ExitCode)."
          }
          Write-Host 'Application remained running for the smoke-test window.'
          Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-shadow-windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true
