<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>Maya Shadow Animation Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const reportReady = () => {
          if (window.__mayaShadowRendererReady) return;
          const root = document.getElementById('root');
          if (!root || !root.firstElementChild) return;
          window.__mayaShadowRendererReady = true;
          window.mayaShadowDesktop?.rendererReady?.();
        };
        const observer = new MutationObserver(reportReady);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', reportReady);
        setTimeout(reportReady, 1000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/ai/assistantWidget.ts"></script>
    <script type="module" src="/src/studio/controlCenter.ts"></script>
    <script type="module" src="/src/studio/createAnimationWizard.ts"></script>
    <script type="module" src="/src/studio/recoveryCenter.ts"></script>
    <script type="module" src="/src/studio/updateCenter.ts"></script>
    <script type="module" src="/src/studio/voiceStudio.ts"></script>
    <script type="module" src="/src/studio/sceneDirector.ts"></script>
    <script type="module" src="/src/studio/exportCenter.ts"></script>
  </body>
</html>
